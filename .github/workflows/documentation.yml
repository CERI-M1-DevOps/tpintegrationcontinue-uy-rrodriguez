name: Serve Javadoc with GitHub Pages
on:
  pull_request:
    branches:
      - main
    #types:
    #  - closed
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  # Permissions when using peaceiris/actions-gh-pages
  contents: write
  # Permissions when using manual deployment steps
  # contents: read
  # pages: write
  # id-token: write

jobs:
  docs:
    name: Documentation
    #if: github.event.pull_request.merged == true
    # Environment needed only when doing manual deployment of GitHub Pages
    # environment:
    #   name: github-pages
    #   url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          # The Java version to set up. Takes a whole or semver Java version. See examples of supported syntax in README file
          java-version: 21
          # Java distribution. See the list of supported distributions in README file
          distribution: corretto
          # Configure cache for Maven
          cache: 'maven'
      - name: Generate Javadoc
        run: mvn -B javadoc::javadoc

      # Deployment using peaceiris/actions-gh-pages (requires an extra branch, created automatically)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/reports/apidocs

      # Manual deployment using GitHub plugins (does not require an extra branch)
